<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>พอร์ตเอิ๊ต</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0B1A3A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="พอร์ตเอิ๊ต">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
<style id="app-css">
:root{
  --bg:#F5F6F3; --surface:#FFFFFF; --sunk:#EEF0EC; --line:#E4E8E3; --ink:#111814; --ink-2:#4A554F; --muted:#8A948E;
  --accent:#0F7A58; --accent-soft:#E2F1E9; --on-accent:#FFFFFF; --gain:#13875C; --gain-soft:#E2F3EA; --loss:#CF4A3E; --loss-soft:#FBE9E6;
  --grid:#ECEFEB; --warn-bg:#FFF6E0; --warn-ink:#7A5410;
  --f-display:"Bai Jamjuree","IBM Plex Sans Thai",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B0F0D; --surface:#131916; --sunk:#0F1411; --line:#222B26; --ink:#EEF3F0; --ink-2:#AEB9B3; --muted:#75817B;
  --accent:#5CCB9E; --accent-soft:#16291F; --on-accent:#08110C; --gain:#5CCB9E; --gain-soft:#132A1F; --loss:#F2837A; --loss-soft:#2E1715;
  --grid:#1B2320; --warn-bg:#2B230E; --warn-ink:#EFCD80; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0B0F0D; --surface:#131916; --sunk:#0F1411; --line:#222B26; --ink:#EEF3F0; --ink-2:#AEB9B3; --muted:#75817B;
  --accent:#5CCB9E; --accent-soft:#16291F; --on-accent:#08110C; --gain:#5CCB9E; --gain-soft:#132A1F; --loss:#F2837A; --loss-soft:#2E1715;
  --grid:#1B2320; --warn-bg:#2B230E; --warn-ink:#EFCD80; color-scheme:dark;}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.6 var(--f-body);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
#app{max-width:880px;margin:0 auto;padding-inline:20px;padding-block:28px 110px;display:flex;flex-direction:column;gap:36px}
h1,h2{font-family:var(--f-display);margin:0;line-height:1.25;text-wrap:balance}
h2{font-size:17px;font-weight:600}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)}
.gain{color:var(--gain)} .loss{color:var(--loss)}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 16px;font-weight:500;font-size:14px;line-height:1.4}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.accent{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.sm{padding:4px 12px;font-size:13px}
.btn.text{border:0;background:none;padding:4px 6px;color:var(--muted);font-size:13px}
.btn.text:hover{color:var(--ink)}
.btn.danger{color:var(--loss)}
.btn.danger.armed{background:var(--loss);border-color:var(--loss);color:#fff}
input[type=text],input[type=number],input[type=month],select{background:var(--sunk);border:1px solid transparent;border-radius:10px;padding:8px 12px;min-width:0;width:100%}
input:focus,select:focus{border-color:var(--accent);outline:none;background:var(--surface)}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:34px;height:34px;border-radius:10px;background:var(--ink);color:var(--bg);display:grid;place-items:center;flex:none}
.brand h1{font-size:18px;font-weight:600}
.brand .sub{font-size:12px;color:var(--muted);line-height:1.2}
.top .right{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;color:var(--muted);background:var(--sunk)}
.pill i{width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.owner{color:var(--accent);background:var(--accent-soft)}
.top .right{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.lockb{display:inline-flex;align-items:center;gap:6px}.lockb svg{width:15px;height:15px}
.login{gap:14px}.lg-row{display:flex;gap:8px;flex-wrap:wrap}.lg-row input{flex:1 1 160px;min-width:0}
.lg-err{margin:0;color:var(--loss);font-size:14px}
.title-edit{display:flex;gap:6px;align-items:center}
.title-edit input{font:600 16px var(--f-display);width:220px}

.banner{background:var(--warn-bg);color:var(--warn-ink);border-radius:14px;padding:10px 16px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:13px}

/* hero */
.hero{display:flex;flex-direction:column;gap:6px}
.hero .lbl{font-size:13px;color:var(--muted)}
.hero .big{font:600 clamp(44px,10vw,76px)/1.05 var(--f-display);letter-spacing:-.03em}
.hero .big .cur{font-size:.5em;vertical-align:.55em;margin-right:4px;color:var(--muted);font-weight:500}
.hero .row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;font-size:14px;color:var(--ink-2)}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:600}
.chip.gain{background:var(--gain-soft)} .chip.loss{background:var(--loss-soft)} .chip.flat{background:var(--sunk);color:var(--muted)}
.dotsep{width:3px;height:3px;border-radius:50%;background:var(--muted);display:inline-block}

/* allocation */
.alloc{display:flex;flex-direction:column;gap:10px}
.alloc .bar{display:flex;height:10px;border-radius:999px;overflow:hidden;gap:2px;background:var(--sunk)}
.alloc .bar span{display:block;height:100%}
.alloc .keys{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--ink-2)}
.alloc .keys span{display:inline-flex;align-items:center;gap:6px}
.alloc .keys b{font-weight:600;color:var(--ink)}
.kdot{width:8px;height:8px;border-radius:50%;display:inline-block}

/* chart panel */
.panel{background:var(--surface);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:14px}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.tabs{display:inline-flex;background:var(--sunk);border-radius:999px;padding:3px;gap:2px;max-width:100%;overflow-x:auto}
.tabs button{border:0;background:transparent;border-radius:999px;padding:5px 14px;font-size:13px;color:var(--muted);white-space:nowrap}
.tabs button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.panel-h.sub{margin-top:-4px}
.tabs.quiet{background:transparent;padding:0;gap:4px;flex-wrap:wrap;overflow:visible}
.tabs.quiet button{border:1px solid var(--line);padding:3px 12px;font-size:12px}
.tabs.quiet button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink);box-shadow:none}
.yr{display:flex;align-items:center;gap:8px;min-width:0}
.yr b{font-family:var(--f-display);font-weight:600;font-size:15px}
.yr small{font-size:11px;color:var(--muted);background:var(--sunk);border-radius:999px;padding:0 8px;white-space:nowrap}
.gbar{display:inline-block;height:4px;border-radius:2px;background:var(--muted);opacity:.7}
.gbar.gain{background:var(--gain)} .gbar.loss{background:var(--loss)}
.hist .r.two{display:flex;flex-direction:column;align-items:flex-end;line-height:1.3}
.hist .r.two small{font-size:11px;white-space:nowrap}
.hist .r.two span{white-space:nowrap}
.ysum{font-size:12px;color:var(--muted);text-align:right;padding-top:2px}
.yrs summary,.yrs .hh{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr) minmax(96px,1fr) 14px}
@media (max-width:560px){.gbar{display:none}.yrs summary,.yrs .hh{grid-template-columns:minmax(0,.8fr) minmax(0,1fr) minmax(90px,1fr) 14px}}
.wealth{display:flex;flex-direction:column;gap:10px}
.wtot{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.wtot b{font:600 15px var(--f-display);color:var(--ink)}
.wbar{flex:1;height:4px;border-radius:2px;background:var(--line);overflow:hidden;max-width:220px}
.wbar i{display:block;height:100%;background:var(--ink)}
.switch{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.switch button{display:flex;align-items:center;gap:12px;text-align:left;border:1.5px solid transparent;background:var(--surface);border-radius:16px;padding:10px 14px;min-width:0}
.switch button[aria-pressed="true"]{border-color:var(--ink)}
.switch .si{width:36px;height:36px;border-radius:11px;background:var(--sunk);color:var(--ink-2);display:grid;place-items:center;flex:none}
.switch .si svg{width:19px;height:19px}
.switch button[aria-pressed="true"] .si{background:var(--ink);color:var(--bg)}
.switch .st{display:flex;flex-direction:column;line-height:1.3;min-width:0}
.switch .st small{font-size:12px;color:var(--muted);white-space:nowrap}
.switch .st b{font:600 17px var(--f-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.goals{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:620px){.goals{grid-template-columns:minmax(0,1fr)}}
.goal{background:var(--surface);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.goal .gh{display:flex;align-items:center;gap:12px}
.goal .grow{flex:1;min-width:0}
.goal .nm{font-weight:600;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.goal .meta{font-size:12px;color:var(--muted)}
.goal .gv{font:600 30px/1.1 var(--f-display);letter-spacing:-.02em}
.prog{height:8px;border-radius:999px;background:var(--sunk);overflow:hidden}
.prog span{display:block;height:100%;border-radius:999px}
.gm{display:flex;justify-content:space-between;gap:4px 10px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.goal.add{border:1.5px dashed var(--line);background:transparent;color:var(--muted);align-items:center;justify-content:center;min-height:110px;font-size:14px}
.goal.add:hover{color:var(--ink);border-color:var(--ink-2)}
.goal-ed{grid-column:1/-1;border-radius:20px;overflow:hidden}
.goal-ed .editor{border-top:0}
.fields{display:grid;grid-template-columns:2fr 1.4fr 1fr 1fr;gap:10px}
@media (max-width:620px){.fields{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.fields label:first-child{grid-column:1/-1}}
.editor select,.editor input[type=number]{background:var(--surface)}
.erow .prev:empty{display:none}
.srct{display:inline-block;font-size:11px;color:var(--ink-2);background:var(--sunk);border-radius:6px;padding:0 6px;margin-right:6px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:bottom}
.fields.two{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
@media (max-width:620px){.fields.two{grid-template-columns:minmax(0,1fr)}}
.hint{font-size:11px;color:var(--muted)}
.srow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 14px;align-items:center;padding:14px 18px;border-top:1px solid var(--grid)}
.srow:first-child{border-top:0}
.srow .nm{font-weight:600;line-height:1.3}
.srow .val{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.srow .val .v{font-weight:600}
.srow .val .p{font-size:12px}
.sits{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:12px;color:var(--muted)}
.sits span{display:inline-flex;align-items:center;gap:5px}
.sbadge{width:38px;height:38px;border-radius:12px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font:600 16px var(--f-display);flex:none}
.dpays{display:flex;flex-wrap:wrap;gap:6px;margin:-4px 0 6px}.dpay{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:3px 4px 3px 10px;border-radius:999px;background:var(--own-soft,var(--sunk));color:var(--muted)}.dpay b{color:var(--ink);font-weight:600}.dpay button{border:0;background:transparent;color:var(--muted);width:22px;height:22px;border-radius:50%;font-size:15px;line-height:1}.dpay button:hover{background:var(--loss-soft);color:var(--loss)}
.sbadge.un{background:var(--sunk);color:var(--muted)}
.sbadge.lg{position:relative;overflow:hidden;width:42px;height:42px;border-radius:13px;color:#fff;letter-spacing:-.03em;
  background:radial-gradient(120% 90% at 20% 0%,color-mix(in srgb,var(--bc) 55%,#fff) 0%,transparent 55%),linear-gradient(150deg,color-mix(in srgb,var(--bc) 82%,#fff),var(--bc) 45%,color-mix(in srgb,var(--bc) 70%,#000));
  box-shadow:inset 0 1px 0 rgb(255 255 255 / .35),inset 0 -2px 0 rgb(0 0 0 / .14),0 2px 6px -1px color-mix(in srgb,var(--bc) 55%,transparent)}
.sbadge.lg::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(180deg,rgb(255 255 255 / .22),transparent 48%);pointer-events:none}
.sbadge.lg b{position:relative;z-index:1;font:700 18px/1 var(--f-display);text-shadow:0 1px 1px rgb(0 0 0 / .22)}
.sbadge.lg.s2 b{font-size:15px}.sbadge.lg.s3 b{font-size:12px;letter-spacing:0}
.sbadge.lg svg{position:relative;z-index:1;width:22px;height:22px;stroke-width:2;filter:drop-shadow(0 1px 1px rgb(0 0 0 / .22))}
.sbadge.lg.img{background:#fff;box-shadow:0 0 0 1px var(--line),0 2px 6px -2px rgb(0 0 0 / .18)}.sbadge.lg.img::after{display:none}.sbadge.lg.img img{width:100%;height:100%;object-fit:cover;display:block}
.se-up{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.se-up .hint{flex-basis:100%}
.btn.up{display:inline-flex;align-items:center;gap:6px;cursor:pointer}.btn.up svg{width:15px;height:15px}
.mark{overflow:hidden;position:relative}.mark.has{width:46px;height:46px;border-radius:50%;background:transparent;filter:drop-shadow(0 2px 4px rgb(0 0 0 / .18))}.mark img{width:100%;height:100%;object-fit:cover;display:block}
.mark.editable{cursor:pointer}.mark.editable i{position:absolute;inset:0;display:grid;place-items:center;background:rgb(0 0 0 / .45);color:#fff;opacity:0;transition:opacity .15s}.mark.editable i svg{width:16px;height:16px}.mark.editable:hover i,.mark.editable:focus-within i{opacity:1}
.se-lbl{font-size:13px;color:var(--muted);margin-bottom:-6px}
.picker .txtopt{font:700 14px var(--f-display)}
.sbe{font-size:12px;font-weight:500;padding:0 4px;color:var(--muted)}
.src-ed{padding:14px 18px 16px;border-top:1px dashed var(--grid);display:flex;flex-direction:column;gap:12px;background:var(--sunk)}
.se-prev{display:flex;gap:14px;align-items:flex-end}.se-prev label{flex:1;display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.src-ed .acts{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}.src-ed .acts span{display:flex;gap:8px}
.sbar{grid-column:2/-1;height:4px;border-radius:2px;background:var(--sunk);overflow:hidden}
.sbar span{display:block;height:100%;background:var(--ink-2)}
.btn.edit{display:inline-flex;align-items:center;gap:5px}
.btn.edit svg{width:14px;height:14px}
.arow .own{margin-top:-4px}
button.srct.add{border:1px dashed var(--ink-2);background:transparent;color:var(--ink);cursor:pointer;font:inherit;font-size:11px}
.goal-set{border:1px dashed var(--line);background:transparent;border-radius:10px;padding:8px;color:var(--ink-2);font-size:13px}
.goal-set:hover,button.srct.add:hover{border-color:var(--ink);color:var(--ink)}
.switch{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:560px){.switch .si{display:none}.switch button{padding:10px 12px}.switch .st b{font-size:15px}}
.wsub{font-size:12px;color:var(--muted)}
.fields.three{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:620px){.fields.three{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.editor input[type=month]{background:var(--surface)}
.panel .intro{font-size:13px;color:var(--muted);margin:2px 0 0}
.plin{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:12px}
@media (max-width:560px){.plin{grid-template-columns:minmax(0,1fr)}}
.plin label{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted)}
.slide{display:flex;gap:10px;align-items:center}
.slide input[type=range]{flex:1;min-width:0;accent-color:var(--accent)}
.slide input[type=number]{width:120px;flex:none}
.cmps{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.cmp{background:var(--sunk);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--muted);border:1.5px solid transparent}
.cmp.hl{border-color:var(--accent);background:var(--accent-soft)}
.cmp .k{font-size:12px;font-weight:600;color:var(--ink-2)}
.cmp b{font:600 20px var(--f-display);color:var(--ink)}
.save-note{font-size:14px;background:var(--gain-soft);border-radius:12px;padding:10px 14px}
.sched summary{cursor:pointer;font-size:13px;color:var(--ink-2);padding:4px 0}
.sched .tbl{max-height:320px;overflow:auto;margin-top:8px;border-radius:12px;border:1px solid var(--grid)}
.sched table{width:100%;border-collapse:collapse;font-size:12px}
.sched th,.sched td{padding:6px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--grid)}
.sched th{position:sticky;top:0;background:var(--surface);color:var(--muted);font-weight:500}
.sched th:nth-child(-n+2),.sched td:nth-child(-n+2){text-align:left}
.fine{font-size:11px;color:var(--muted);margin:0}

/* section colors */
:root{--c-inv:#0F7A58;--c-inv-soft:#E2F1E9;--c-sav:#2F6FD0;--c-sav-soft:#E4ECFA;--c-debt:#C8532E;--c-debt-soft:#FBE8E0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--c-inv:#5CCB9E;--c-inv-soft:#16291F;--c-sav:#86AEF2;--c-sav-soft:#172238;--c-debt:#F2946F;--c-debt-soft:#35190F}}
:root[data-theme="dark"]{--c-inv:#5CCB9E;--c-inv-soft:#16291F;--c-sav:#86AEF2;--c-sav-soft:#172238;--c-debt:#F2946F;--c-debt-soft:#35190F}
#app{--sec:var(--c-inv);--sec-soft:var(--c-inv-soft)}
#app.v-sav{--sec:var(--c-sav);--sec-soft:var(--c-sav-soft)}
#app.v-debt{--sec:var(--c-debt);--sec-soft:var(--c-debt-soft)}
.c-inv,.switch button[data-v="inv"]{--own:var(--c-inv);--own-soft:var(--c-inv-soft)}
.c-sav,.switch button[data-v="sav"]{--own:var(--c-sav);--own-soft:var(--c-sav-soft)}
.c-debt,.switch button[data-v="debt"]{--own:var(--c-debt);--own-soft:var(--c-debt-soft)}
.add-btn{border-color:var(--own);color:var(--own);background:var(--surface)}
.add-btn.on,.add-btn:hover{background:var(--own);border-color:var(--own);color:var(--surface)}
.switch .si{background:var(--own-soft);color:var(--own)}
.switch .st small{color:var(--own)}
.switch button[aria-pressed="true"]{border-color:var(--own);background:var(--own-soft)}
.switch button[aria-pressed="true"] .si{background:var(--own);color:var(--surface)}
.hero .lbl{color:var(--sec);font-weight:600}
.hero .big .cur{color:var(--sec)}
.sec-h h2::before{content:"";display:inline-block;width:4px;height:15px;border-radius:2px;background:var(--sec);margin-right:9px;vertical-align:-2px}
.panel{box-shadow:inset 0 3px 0 var(--sec)}
.entry{border-color:var(--sec);box-shadow:none}
.tabs.quiet button[aria-pressed="true"]{background:var(--sec);border-color:var(--sec);color:var(--surface)}
.tabs button[aria-pressed="true"]{color:var(--sec)}
.cmp.hl{border-color:var(--sec);background:var(--sec-soft)}
.slide input[type=range]{accent-color:var(--sec)}
.goal.add:hover{border-color:var(--sec);color:var(--sec)}

/* wealth goal */
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .goalx{--ink:#1B2822}}

.gx-top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}
.gx-eye{font-size:12px;letter-spacing:.06em;opacity:.65}
.gx-title{font:600 20px/1.3 var(--f-display);margin:2px 0 4px}
.gx-link{border:0;background:none;color:inherit;opacity:.6;font-size:12px;text-decoration:underline;padding:0 4px}
.gx-msg{font-size:14px;opacity:.85}
.gx-pct{text-align:right;flex:none;display:flex;flex-direction:column;line-height:1}
.gx-pct b{font:700 clamp(36px,7vw,52px)/1 var(--f-display);letter-spacing:-.02em;background:linear-gradient(90deg,var(--g1),var(--g2));-webkit-background-clip:text;background-clip:text;color:transparent}
.gx-pct span{font-size:12px;opacity:.65;margin-top:6px}
.gx-bar{position:relative;height:14px;border-radius:999px;background:color-mix(in srgb,var(--bg) 16%,transparent);overflow:hidden}
.gx-fill{position:absolute;inset:0 auto 0 0;border-radius:999px;background:linear-gradient(90deg,var(--g1),var(--g2))}
@media (prefers-reduced-motion:no-preference){.gx-fill{animation:gxgrow 1.1s cubic-bezier(.2,.8,.2,1)}@keyframes gxgrow{from{width:0}}}
.gx-tick{position:absolute;top:3px;bottom:3px;width:2px;margin-left:-1px;background:color-mix(in srgb,var(--bg) 35%,transparent);border-radius:1px}
.gx-tick.done{background:color-mix(in srgb,var(--ink) 35%,transparent)}
.gx-scale{position:relative;height:14px;font-size:11px;margin-top:-8px}
.gx-scale span{position:absolute;transform:translateX(-50%);opacity:.5;white-space:nowrap}
.gx-scale span:last-child{transform:translateX(-100%)}
.gx-scale span.done{opacity:.95;font-weight:600}
.gx-stats{display:flex;flex-wrap:wrap;gap:10px 28px}
.gx-stats div{display:flex;flex-direction:column;line-height:1.3}
.gx-stats span{font-size:12px;opacity:.6}
.gx-stats b{font:600 17px var(--f-display)}
.gx-plan{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:14px;align-items:center;border-top:1px solid color-mix(in srgb,var(--bg) 15%,transparent);padding-top:14px}
@media (max-width:620px){.gx-plan{grid-template-columns:minmax(0,1fr)}.gx-top{flex-direction:column}.gx-pct{text-align:left}}
.gx-ctrl{display:flex;flex-wrap:wrap;gap:12px 18px}
.gx-ctrl label{display:flex;flex-direction:column;gap:6px;font-size:12px;opacity:.9}
.gx-in{display:flex;align-items:center;gap:4px;background:color-mix(in srgb,var(--bg) 12%,transparent);border-radius:10px;padding:0 10px}
.gx-in input{background:transparent!important;border:0!important;color:inherit;width:100px;padding:7px 0}
.gx-rs{display:inline-flex;gap:4px}
.gx-rs button{border:1px solid color-mix(in srgb,var(--bg) 25%,transparent);background:transparent;color:inherit;border-radius:999px;padding:4px 10px;font-size:12px}
.gx-rs button[aria-pressed="true"]{background:var(--bg);color:var(--ink);border-color:var(--bg);font-weight:600}
.gx-eta{display:flex;flex-direction:column;gap:2px;line-height:1.35}
.gx-eta span{font-size:12px;opacity:.65}
.gx-eta b{font:600 22px var(--f-display)}
.gx-eta small{font-size:12px;opacity:.75}
.gx-eta em{font-style:normal;font-size:12px;margin-top:4px;color:var(--g1)}
.gx-edit{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0}
.gx-edit input{background:color-mix(in srgb,var(--bg) 12%,transparent)!important;color:inherit;border:0;width:160px}
.irr-note{font-size:12px;color:var(--muted);margin:2px 0 0}
.hero .row .chip+.chip{margin-left:-6px}
.efields{display:flex;flex-wrap:wrap;gap:12px}
.pend{display:inline-block;font-size:11px;font-weight:600;color:var(--warn-ink);background:var(--warn-bg);border-radius:999px;padding:1px 8px;white-space:nowrap}

.pendb .btn{background:var(--surface)}
.sdate{display:block;font-size:11px;color:var(--muted);line-height:1.2}
.erow.s4{grid-template-columns:minmax(0,1.3fr) repeat(3,minmax(0,1fr))}
.erow.s4 .prev{grid-column:2/-1}
.erow .who small{font-weight:400}
@media (max-width:560px){.erow.s4{grid-template-columns:repeat(3,minmax(0,1fr))}.erow.s4 .who,.erow.s4 .prev{grid-column:1/-1}}
.lm{display:flex;flex-direction:column;gap:14px}
.lm-nav{display:flex;align-items:center;gap:10px}
.lm-nav b{font:600 17px var(--f-display)}
.lm-nav .btn{padding:2px 12px}
.lm-nav .btn[disabled]{opacity:.35;cursor:default}
.lm-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:620px){.lm-stats{grid-template-columns:minmax(0,1fr)}}
.lm-stats>div{background:var(--sunk);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.lm-stats span{font-size:12px;color:var(--muted)}
.lm-stats b{font:600 22px var(--f-display)}
.lm-stats small{font-size:12px;color:var(--muted)}
.lm-stats small.gain{color:var(--gain)} .lm-stats small.loss{color:var(--loss)}
.lm-list{display:flex;flex-direction:column;overflow-x:auto}
.lm-row{display:grid;grid-template-columns:minmax(150px,1.6fr) repeat(4,minmax(80px,1fr));gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--grid);font-size:13px;min-width:520px}
.lm-row>span:not(:first-child){text-align:right}
.lm-row.hd{border-top:0;font-size:12px;color:var(--muted);padding-top:0}
.lm-row .aname{display:flex;align-items:center;gap:8px;min-width:0}
.topnav{display:flex;gap:6px;background:var(--surface);border-radius:16px;padding:5px;position:sticky;top:env(safe-area-inset-top,0px);z-index:4;box-shadow:0 2px 10px rgba(0,0,0,.04)}
.topnav button{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;border:0;background:transparent;border-radius:12px;padding:9px 6px;font-size:14px;color:var(--ink-2);white-space:nowrap}
.topnav button svg{width:18px;height:18px;color:var(--own)}
.topnav button[aria-pressed="true"]{background:var(--own-soft);color:var(--own);font-weight:600}
@media (max-width:480px){.topnav button{flex-direction:column;gap:2px;font-size:12px;padding:7px 2px}}
:root{--c-home:var(--ink);--c-home-soft:var(--sunk)}
.c-home{--own:var(--c-home);--own-soft:var(--c-home-soft)}
#app.v-home{--sec:var(--ink);--sec-soft:var(--sunk)}
.home-hero .row span{display:inline-flex;align-items:center;gap:6px}
.actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:620px){.actions{grid-template-columns:minmax(0,1fr)}}
.act{display:flex;align-items:center;gap:12px;text-align:left;border:1.5px solid var(--own);background:var(--own-soft);color:var(--ink);border-radius:16px;padding:14px 16px}
.act svg{width:34px;height:34px;padding:7px;border-radius:10px;background:var(--own);color:var(--surface);flex:none}
.act span{display:flex;flex-direction:column;line-height:1.3;min-width:0}
.act b{font:600 15px var(--f-display);color:var(--own)}
.act small{font-size:12px;color:var(--muted)}
.act:hover{filter:brightness(.97)}
.c-wrap.v-inv-local{--sec:var(--c-inv);--sec-soft:var(--c-inv-soft)}
.c-wrap.v-sav-local{--sec:var(--c-sav);--sec-soft:var(--c-sav-soft)}
.c-wrap.v-debt-local{--sec:var(--c-debt);--sec-soft:var(--c-debt-soft)}
.mv{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}

.mv span{font-size:12px;color:var(--muted)}
.mv b{font:600 20px var(--f-display)}
.mv small{font-size:13px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:12px;height:3px;border-radius:2px;display:inline-block;flex:none}
.sw.box{width:9px;height:9px;border-radius:3px}
.sw.dash{height:0;border-top:2px dashed var(--muted);background:none!important}
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;overflow:visible}
.chart .ax text{fill:var(--muted);font:11px var(--f-body)}
.chart .gridl{stroke:var(--grid);stroke-width:1}
.chart .guide{stroke:var(--muted);stroke-width:1;stroke-dasharray:2 3}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:12px;box-shadow:0 8px 24px rgba(0,0,0,.12);min-width:180px;z-index:2;display:flex;flex-direction:column;gap:3px}

.tip .r{display:flex;justify-content:space-between;gap:14px;align-items:center}
.tip .r span:first-child{display:inline-flex;align-items:center;gap:6px;color:var(--ink-2)}

/* section heads */
.sec{display:flex;flex-direction:column;gap:12px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sec-h .note{font-size:12px;color:var(--muted)}

/* icons */
.ico{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;flex:none}
.ico svg{width:22px;height:22px}
.ico.sm{width:26px;height:26px;border-radius:8px}

.list{background:var(--surface);border-radius:20px;overflow:hidden}

.addrow{padding:12px 18px;border-top:1px solid var(--grid)}

.editor{padding:16px 18px;border-top:1px solid var(--grid);background:var(--sunk);display:flex;flex-direction:column;gap:12px}
.editor label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.editor input[type=text]{background:var(--surface)}
.picker{display:flex;flex-wrap:wrap;gap:6px}
.picker button{border:1px solid transparent;background:var(--surface);border-radius:10px;width:40px;height:40px;display:grid;place-items:center;color:var(--ink-2)}
.picker button svg{width:20px;height:20px}
.picker button[aria-pressed="true"]{border-color:var(--ink);color:var(--ink)}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.swatches button{width:26px;height:26px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.swatches button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}
.editor .acts{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}
.editor .acts span{display:flex;gap:8px}

/* history */
.hist{background:var(--surface);border-radius:20px;overflow:hidden}
.hist details{border-top:1px solid var(--grid)}
.hist details:first-child{border-top:0}

.hist summary::-webkit-details-marker{display:none}
.hist summary:hover{background:var(--sunk)}
.hist summary .r{text-align:right}
.hist summary .chev{color:var(--muted);transition:transform .15s}
.hist details[open] summary .chev{transform:rotate(90deg)}
.hist .hh{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr) 78px 14px;gap:10px;padding:10px 18px 6px;font-size:12px;color:var(--muted)}
.hist .hh .r{text-align:right}
.hist .body{padding:4px 18px 14px;display:flex;flex-direction:column;gap:8px}
.hline{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:10px;align-items:center;font-size:13px}
.hline .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2)}
.hline .r{text-align:right;min-width:70px}
.hist .body .acts{display:flex;justify-content:flex-end;gap:6px;padding-top:4px}

.entry{border:1.5px solid var(--ink)}

.erow{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1.3fr);gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--grid)}
.erow .who{display:flex;align-items:center;gap:10px;min-width:0;font-weight:500}
.erow .who span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.erow .stat{display:flex;gap:6px}
.erow .stat select{width:auto;flex:none}
.erow .prev{grid-column:2/-1;font-size:12px;color:var(--muted);margin-top:-4px}
.erow.hd{border-top:0;font-size:12px;color:var(--muted);padding-bottom:0}

.entry .foot-acts{display:flex;gap:8px;justify-content:flex-end}
.fieldm{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted);max-width:200px}

.savebar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(560px,calc(100% - 32px));background:var(--ink);color:var(--bg);border-radius:999px;padding:8px 8px 8px 20px;display:flex;align-items:center;justify-content:space-between;gap:10px;z-index:5;box-shadow:0 10px 30px rgba(0,0,0,.25);font-size:13px}
.savebar span.acts{display:flex;gap:6px}
.savebar .btn{background:transparent;color:var(--bg);border-color:transparent}
.savebar .btn.accent{background:var(--accent);color:var(--on-accent)}
.foot{font-size:12px;color:var(--muted);text-align:center}
.empty{padding:28px 18px;text-align:center;color:var(--muted);font-size:14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

/* ---------- model ---------- */
function compute(){
  var recs=state.records.slice().sort(function(a,b){return a.m<b.m?-1:a.m>b.m?1:0});
  var months=[];
  if(recs.length){var m=recs[0].m,last=recs[recs.length-1].m;while(m<=last){months.push(m);m=nextMonth(m)}}
  var byKey={};recs.forEach(function(r){byKey[r.m+"|"+r.a]=r});
  var A=state.assets.map(function(a){
    var cost=0,val=0,started=false,rows=[];
    months.forEach(function(m){
      var r=byKey[m+"|"+a.id];var amt=r?(+r.amt||0):0;cost+=amt;
      if(r){started=true;val=(r.val==null||r.val==="")?val+amt:+r.val}
      rows.push({m:m,amt:amt,cost:cost,val:started?val:0,rec:r||null,pct:cost>0?(val/cost-1)*100:0});
    });
    return {a:a,rows:rows,cost:cost,val:val,pl:val-cost,pct:cost>0?(val/cost-1)*100:0};
  });
  var hv={},pend={};recs.forEach(function(r){if(r.val!=null&&r.val!=='')hv[r.m]=1;else pend[r.m]=1});
  var tot=months.map(function(m,i){var c=0,v=0,amt=0;A.forEach(function(x){c+=x.rows[i].cost;v+=x.rows[i].val;amt+=x.rows[i].amt});return {m:m,cost:c,val:v,amt:amt,pl:v-c,pct:c>0?(v/c-1)*100:0,hasVal:!!hv[m],pending:!!pend[m]}});
  var last=tot[tot.length-1]||{cost:0,val:0,pl:0,pct:0,amt:0};
  var years=[],yi={};
  months.forEach(function(m,i){var y=m.slice(0,4);if(!(y in yi)){yi[y]=years.length;years.push({y:y,i0:i,i1:i})}years[yi[y]].i1=i});
  years.forEach(function(Y){
    var p=Y.i0-1;
    function seg(get){var vs=p>=0?get(p).val:0,ve=get(Y.i1).val,c=0;for(var k=Y.i0;k<=Y.i1;k++)c+=get(k).amt;var g=ve-vs-c,den=vs+c/2;return{valStart:vs,valEnd:ve,contrib:c,gain:g,ret:den>0?g/den*100:0,costEnd:get(Y.i1).cost}}
    var t=seg(function(k){return tot[k]});for(var key in t)Y[key]=t[key];
    Y.cumPct=tot[Y.i1].pct;Y.hasVal=false;for(var q=Y.i0;q<=Y.i1;q++)if(tot[q].hasVal)Y.hasVal=true;Y.lastM=months[Y.i1];
    Y.assets=A.map(function(x){var r=seg(function(k){return x.rows[k]});r.a=x.a;r.active=r.contrib>0||r.valEnd>0;return r});
  });
  var N=months.length,iv=0,iflows=[],ex=[];
  A.forEach(function(x){var fl=[],first=-1;x.rows.forEach(function(r,i){if(r.amt>0){fl.push([i,r.amt]);if(first<0)first=i}});
    x.held=first<0?0:N-first;x.irr=x.held>=6&&x.val>0?irrAnnual(fl,N,x.val):null;
    if(x.irr!=null){iv+=x.val;iflows=iflows.concat(fl)}else if(x.val>0)ex.push(x.a.name)});
  var pirr=iflows.length?irrAnnual(iflows,N,iv):null;
  return {months:months,A:A,tot:tot,last:last,years:years,irr:pirr,irrEx:ex,activeMonths:tot.filter(function(t){return t.amt>0}).length};
}

function irrAnnual(fl,N,val){var lo=-0.2,hi=0.3;function fv(r){var s=0;fl.forEach(function(f){s+=f[1]*Math.pow(1+r,N-f[0])});return s}
  if(fv(lo)>val||fv(hi)<val)return null;for(var k=0;k<100;k++){var mid=(lo+hi)/2;if(fv(mid)<val)lo=mid;else hi=mid}return(Math.pow(1+(lo+hi)/2,12)-1)*100}
/* ---------- SVG charts ---------- */
function niceStep(range,n){var raw=range/n;var mag=Math.pow(10,Math.floor(Math.log10(raw||1)));var f=raw/mag;return(f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*mag}
function scaleY(min,max,n){if(max===min)max=min+1;var step=niceStep(max-min,n);var lo=Math.floor(min/step)*step,hi=Math.ceil(max/step)*step;var t=[];for(var v=lo;v<=hi+step*1e-6;v+=step)t.push(+v.toFixed(10));return{lo:lo,hi:hi,ticks:t}}
function drawChart(host,opt){
  host.innerHTML="";
  var W=Math.max(260,host.clientWidth||600),H=W<520?210:250;
  var pl=opt.yWidth||44,pr=8,pt=8,pb=24,iw=W-pl-pr,ih=H-pt-pb,n=opt.labels.length;
  if(!n){host.innerHTML='<div class="empty">ยังไม่มีข้อมูล</div>';return}
  var min=0,max=0;
  if(opt.type==="stack")opt.labels.forEach(function(_,i){var s=0;opt.series.forEach(function(se){s+=se.values[i]||0});max=Math.max(max,s)});
  else opt.series.forEach(function(se){se.values.forEach(function(v){if(v!=null){max=Math.max(max,v);min=Math.min(min,v)}})});
  var sc=scaleY(min,max,3),y=function(v){return pt+ih-(v-sc.lo)/(sc.hi-sc.lo)*ih},band=iw/n;
  var x=opt.type==="stack"?function(i){return pl+band*(i+.5)}:function(i){return n===1?pl+iw/2:pl+iw*i/(n-1)};
  var s='<svg viewBox="0 0 '+W+' '+H+'" height="'+H+'" role="img" aria-label="'+esc(opt.aria||"")+'"><defs><linearGradient id="gA" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+(opt.areaColor||"#000")+'" stop-opacity=".22"/><stop offset="1" stop-color="'+(opt.areaColor||"#000")+'" stop-opacity="0"/></linearGradient></defs><g class="ax">';
  sc.ticks.forEach(function(t){s+='<line class="gridl" x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y(t)+'" y2="'+y(t)+'"/><text x="'+(pl-8)+'" y="'+(y(t)+4)+'" text-anchor="end">'+esc(opt.yfmt(t))+'</text>'});
  var every=Math.ceil(n/Math.max(2,Math.floor(iw/64)));
  opt.labels.forEach(function(l,i){if(i%every===0)s+='<text x="'+x(i)+'" y="'+(H-4)+'" text-anchor="middle">'+esc((opt.xfmt||mLabel)(l))+'</text>'});
  s+='</g>';
  if(opt.type==="stack"){
    var bw=Math.max(2,Math.min(22,band*.56));
    opt.labels.forEach(function(_,i){var acc=0,segs=[];opt.series.forEach(function(se){var v=se.values[i]||0;if(v>0){segs.push([acc,v,se.color]);acc+=v}});
      segs.forEach(function(g,j){var y0=y(g[0]),y1=y(g[0]+g[1]);s+='<rect x="'+(x(i)-bw/2)+'" y="'+y1+'" width="'+bw+'" height="'+Math.max(0,y0-y1-(j<segs.length-1?1.5:0))+'" rx="'+(j===segs.length-1?Math.min(4,bw/2):0)+'" fill="'+g[2]+'"/>'})});
  }else{
    opt.series.forEach(function(se){
      var pts=[];se.values.forEach(function(v,i){if(v!=null)pts.push([x(i),y(v)])});if(!pts.length)return;
      var d=pts.map(function(p,i){return(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)}).join("");
      var base=y(Math.max(sc.lo,0));
      if(se.area)s+='<path d="'+d+"L"+pts[pts.length-1][0].toFixed(1)+" "+base+"L"+pts[0][0].toFixed(1)+" "+base+'Z" fill="url(#gA)"/>';
      s+='<path d="'+d+'" fill="none" stroke="'+se.color+'" stroke-width="'+(se.width||2)+'" stroke-linejoin="round" stroke-linecap="round"'+(se.dash?' stroke-dasharray="4 4"':"")+'/>';
      var e=pts[pts.length-1];if(!se.dash)s+='<circle cx="'+e[0]+'" cy="'+e[1]+'" r="4" fill="'+se.color+'" stroke="var(--surface)" stroke-width="2"/>';
    });
  }
  s+='<g class="hov"></g><rect x="'+pl+'" y="'+pt+'" width="'+iw+'" height="'+ih+'" fill="transparent" class="hit"/></svg>';
  host.innerHTML=s;
  var tip=document.createElement("div");tip.className="tip";tip.hidden=true;host.appendChild(tip);
  var svg=host.querySelector("svg"),hov=host.querySelector(".hov"),hit=host.querySelector(".hit");
  function show(ev){
    var r=svg.getBoundingClientRect(),px=(ev.clientX-r.left)*W/r.width;
    var i=opt.type==="stack"?Math.floor((px-pl)/band):Math.round((px-pl)/(n===1?1:iw/(n-1)));i=Math.max(0,Math.min(n-1,i));
    var g='<line class="guide" x1="'+x(i)+'" x2="'+x(i)+'" y1="'+pt+'" y2="'+(pt+ih)+'"/>';
    if(opt.type!=="stack")opt.series.forEach(function(se){var v=se.values[i];if(v!=null)g+='<circle cx="'+x(i)+'" cy="'+y(v)+'" r="4" fill="'+se.color+'" stroke="var(--surface)" stroke-width="2"/>'});
    hov.innerHTML=g;tip.innerHTML=opt.tip(i);tip.hidden=false;
    var tx=x(i)*r.width/W+14,tw=tip.offsetWidth;if(tx+tw>r.width)tx=x(i)*r.width/W-tw-14;
    tip.style.left=Math.max(0,tx)+"px";tip.style.top="0px";
  }
  hit.addEventListener("pointermove",show);hit.addEventListener("pointerdown",show);
  hit.addEventListener("pointerleave",function(){hov.innerHTML="";tip.hidden=true});
}
function spark(x){
  var v=x.rows.map(function(r){return r.cost>0?r.val:null}).filter(function(z){return z!=null});
  if(v.length<2)return '<span class="spark"></span>';
  var mn=Math.min.apply(null,v),mx=Math.max.apply(null,v),W=110,H=34;if(mx===mn)mx=mn+1;
  var d=v.map(function(z,i){return(i?"L":"M")+(i*(W-4)/(v.length-1)+2).toFixed(1)+" "+(H-3-(z-mn)/(mx-mn)*(H-6)).toFixed(1)}).join("");
  var ex=W-2,ey=H-3-(v[v.length-1]-mn)/(mx-mn)*(H-6);
  return '<svg class="spark" viewBox="0 0 '+W+' '+H+'" aria-hidden="true"><path d="'+d+'" fill="none" stroke="'+x.a.color+'" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><circle cx="'+ex+'" cy="'+ey.toFixed(1)+'" r="2.6" fill="'+x.a.color+'"/></svg>';
}

function view(M,rg,st){
  var n=M.months.length,idx=[],i;
  if(rg==="12m"){for(i=Math.max(0,n-12);i<n;i++)idx.push(i);return{idx:idx,yearly:false}}
  if(rg!=="all"){for(i=0;i<n;i++)if(M.months[i].slice(0,4)===rg)idx.push(i);return{idx:idx,yearly:false}}
  if(st==="year")return{idx:M.years.map(function(Y){return Y.i1}),yearly:true};
  for(i=0;i<n;i++)idx.push(i);return{idx:idx,yearly:false};
}

var CS;
function computeS(){
  var recs=state.srecords.slice().sort(function(a,b){return a.m<b.m?-1:a.m>b.m?1:0}),months=[];
  if(recs.length){var m=recs[0].m,last=recs[recs.length-1].m;while(m<=last){months.push(m);m=nextMonth(m)}}
  var byKey={},opM={};recs.forEach(function(r){if(r.op)opM[r.m+"|"+r.a]=r;else byKey[r.m+"|"+r.a]=r});
  var A=state.savings.map(function(a){
    var cd=0,ci=0,bal=0,rows=[];
    months.forEach(function(m){var r=byKey[m+"|"+a.id],orr=opM[m+"|"+a.id],op=orr?(+orr.dep||0):0,io=sIO(r),dep=io[0]-io[1],it=r?(+r.int||0):0;cd+=dep+op;ci+=it;bal+=dep+it+op;
      rows.push({m:m,dep:dep,din:io[0],wd:io[1],open:op,int:it,bal:bal,cost:cd,cumInt:ci,rec:r||orr||null,orec:orr||null})});
    return{a:a,rows:rows,bal:bal,cumDep:cd,cumInt:ci};
  });
  var tot=months.map(function(m,i){var o={m:m,dep:0,int:0,bal:0,cost:0,cumInt:0};A.forEach(function(x){var r=x.rows[i];o.dep+=r.dep;o.int+=r.int;o.bal+=r.bal;o.cost+=r.cost;o.cumInt+=r.cumInt});return o});
  var years=[],yi={};
  months.forEach(function(m,i){var y=m.slice(0,4);if(!(y in yi)){yi[y]=years.length;years.push({y:y,i0:i,i1:i})}years[yi[y]].i1=i});
  years.forEach(function(Y){
    function seg(get){var bs=Y.i0>0?get(Y.i0-1).bal:0,d=0,it=0;for(var k=Y.i0;k<=Y.i1;k++){d+=get(k).dep;it+=get(k).int}var den=bs+d/2;return{balStart:bs,balEnd:get(Y.i1).bal,dep:d,int:it,ret:den>0?it/den*100:0}}
    var t=seg(function(k){return tot[k]});for(var key in t)Y[key]=t[key];
    Y.lastM=months[Y.i1];
    Y.assets=A.map(function(x){var r=seg(function(k){return x.rows[k]});r.a=x.a;r.active=r.dep!==0||r.balEnd!==0;return r});
  });
  return{months:months,A:A,tot:tot,years:years,last:tot[tot.length-1]||{bal:0,cost:0,cumInt:0,dep:0,int:0}};
}
function sIO(r){if(!r)return[0,0];var d=+r.dep||0,w=+r.wd||0;if(d<0){w+=-d;d=0}return[d,w]}
function sIcon(a,sm){return '<span class="ico'+(sm?" sm":"")+'" style="background:color-mix(in srgb,'+a.color+' 15%,transparent);color:'+a.color+'">'+svgIcon(a.icon||"piggy")+'</span>'}
function rangeBar(M,rv,sv,ra,sa){
  var ranges=[["all","ตลอดช่วง"],["12m","12 เดือนล่าสุด"]].concat(M.years.slice().reverse().map(function(Y){return[Y.y,"ปี "+be(Y.y)]}));
  return '<div class="panel-h sub"><div class="tabs quiet" role="group" aria-label="ช่วงเวลา">'+ranges.map(function(r){return '<button data-act="'+ra+'" data-v="'+r[0]+'" aria-pressed="'+(rv===r[0])+'">'+r[1]+'</button>'}).join("")+'</div>'+
    (rv==="all"?'<div class="tabs quiet" role="group" aria-label="ความละเอียด"><button data-act="'+sa+'" data-v="month" aria-pressed="'+(sv==="month")+'">รายเดือน</button><button data-act="'+sa+'" data-v="year" aria-pressed="'+(sv==="year")+'">รายปี</button></div>':'')+'</div>';
}
function avgDep(x){var r=x.rows.slice(-6),s=0,n=0;r.forEach(function(z){if(z.rec&&!z.rec.op){s+=z.dep;n++}});return n?s/n:0}

  h+='</div></section>';

  // chart
  if(ui.sRange!=="all"&&ui.sRange!=="12m"&&!S.years.some(function(Y){return Y.y===ui.sRange}))ui.sRange="all";

     rangeBar(S,ui.sRange,ui.sStep,"srange","sstep")+
     '<div class="legend">'+state.savings.map(function(a){return '<span><i class="sw box" style="background:'+a.color+'"></i>'+esc(a.name)+'</span>'}).join("")+'</div><div class="chart" id="chart"></div></section>';

  if(S.years.length){

    S.A.forEach(function(x){var r=x.rows[i];if(!r.rec)return;if(r.orec)h+='<div class="hline">'+sIcon(x.a,true)+'<span class="n">'+esc(x.a.name)+'<small class="muted"> · ยอดยกมา (ยอดที่มีอยู่แล้ว)</small></span><span class="r">'+baht(r.open)+'</span><span class="r">'+(r.rec.op?baht(r.bal):'')+'</span></div>';if(r.rec.op)return;h+='<div class="hline">'+sIcon(x.a,true)+'<span class="n">'+esc(x.a.name)+(r.rec.d?'<small class="muted"> · '+esc(fmtD(r.rec.d))+'</small>':'')+'</span><span class="r">'+(r.din?'<span class="gain">+'+baht(r.din)+'</span> ':'')+(r.wd?'<span class="loss">−'+baht(r.wd)+'</span> ':'')+(!r.din&&!r.wd?'–':'')+(r.int?' <small class="gain">ดอกเบี้ย '+sbaht(r.int)+'</small>':'')+'</span><span class="r">'+baht(r.bal)+'</span></div>'});

  }
  h+='</div></section>';
  return h;
}

function sFind(m,a){for(var i=0;i<state.srecords.length;i++){var r=state.srecords[i];if(r.m===m&&r.a===a&&!r.op)return r}return null}
function sOpen(a){for(var i=0;i<state.srecords.length;i++){var r=state.srecords[i];if(r.a===a&&r.op)return r}return null}
function sBalBefore(a,m){var b=0;state.srecords.forEach(function(r){if(r.a===a&&r.m<m){if(r.op){b+=+r.dep||0;return}var io=sIO(r);b+=io[0]-io[1]+(+r.int||0)}});return b}
function sLastDep(a,m){var b=null;state.srecords.forEach(function(r){if(r.a===a&&r.m<m&&(!b||r.m>b.m))b=r});return b?b.dep:""}
function sRead(a){var d=document.getElementById("sd-"+a).value,w=document.getElementById("sw-"+a).value,i=document.getElementById("si-"+a).value;return{dep:d===""?0:Math.abs(+d),wd:w===""?0:Math.abs(+w),int:i===""?0:+i,empty:d===""&&w===""&&i===""}}
function updateSPreviews(){if(!ui.sEntryOpen)return;state.savings.forEach(function(a){var pv=document.getElementById("sp-"+a.id);if(!pv)return;var r=sRead(a.id);
  if(r.empty){pv.textContent="ไม่มีความเคลื่อนไหว";return}var b0=sBalBefore(a.id,ui.sEntryMonth);pv.innerHTML=baht(b0)+(r.dep?' <span class="gain">+'+baht(r.dep)+'</span>':'')+(r.wd?' <span class="loss">−'+baht(r.wd)+'</span>':'')+(r.int?' <span class="gain">+'+baht(r.int)+' ดอกเบี้ย</span>':'')+' = ยอดใหม่ <b>'+baht(b0+r.dep-r.wd+r.int)+'</b>'})}
function captureS(){if(!ui.sEntryOpen)return null;var o={};document.querySelectorAll("#sentry input").forEach(function(e){o[e.id]=e.value});return o}
function restoreS(o){if(ui.sEntryOpen){if(o&&o["se-month"]===ui.sEntryMonth)Object.keys(o).forEach(function(k){var e=document.getElementById(k);if(e)e.value=o[k]});updateSPreviews()}}

function drawSavings(){
  var el=document.getElementById("chart");if(!el)return;
  var S=CS,V=view(S,ui.sRange,ui.sStep),idx=V.idx,Yr=V.yearly;
  var labels=idx.map(function(i){return Yr?S.months[i].slice(0,4):S.months[i]});
  var xfmt=Yr?be:(ui.sRange!=="all"&&ui.sRange!=="12m"?mShort:mLabel);
  function title(k){var i=idx[k];if(!Yr)return mLabel(S.months[i],true);var Y=S.years[k];return "ปี "+be(Y.y)+(Y.lastM.slice(5)!=="12"?" (ถึง "+mShort(Y.lastM)+")":" (สิ้นปี)")}

function project(d,bal,start,extra,lump){

  return{rows:rows,n:rows.length,interest:ti,end:rows.length?rows[rows.length-1].m:start};

    ui.sEntryOpen=false;change();break;
  case "s-del-month":
    if(armedBefore==="sdelm:"+b.dataset.m){var sdm=b.dataset.m;state.srecords=state.srecords.filter(function(r){return r.op||r.m!==sdm});change()}
    else{ui.armed="sdelm:"+b.dataset.m;ui.open["s"+b.dataset.m]=true;render()}break;
  case "s-new":ui.sEdit="new";ui.sDraft={src:"",name:"",kind:"deposit",rate:"",target:"",icon:"shield",color:PALETTE[(state.savings.length+3)%PALETTE.length]};render();var sn=document.getElementById("sed-name");if(sn)sn.focus();break;
  case "s-edit":var sa0=state.savings.find(function(x){return x.id===b.dataset.id});ui.sEdit=sa0.id;var op0=sOpen(sa0.id);ui.sDraft={open:op0?op0.dep:"",src:sa0.src||"",name:sa0.name,kind:sa0.kind||"deposit",rate:sa0.rate,target:sa0.target,icon:sa0.icon||"piggy",color:sa0.color};render();break;
  case "sed-icon":syncSDraft();ui.sDraft.icon=b.dataset.v;render();break;
  case "sed-color":syncSDraft();ui.sDraft.color=b.dataset.v;render();break;
  case "sed-cancel":ui.sEdit=null;render();break;
  case "sed-ok":
    syncSDraft();var sd=ui.sDraft,snm=(sd.name||"").trim();if(!snm){var se=document.getElementById("sed-name");if(se)se.focus();return}
    var obj={name:snm,src:(sd.src||"").trim(),kind:sd.kind,rate:sd.rate===""||sd.rate==null?null:+sd.rate,target:sd.target===""||sd.target==null?null:+sd.target,icon:sd.icon,color:sd.color};
    if(ui.sEdit==="new"){obj.id=uid();state.savings.push(obj)}else{var st0=state.savings.find(function(x){return x.id===ui.sEdit});for(var kk in obj)st0[kk]=obj[kk];obj.id=st0.id}
    var ov=+sd.open||0,orec=sOpen(obj.id);
    if(ov>0){if(orec)orec.dep=round2(ov);else{var fm=state.srecords.filter(function(r){return r.a===obj.id}).map(function(r){return r.m}).sort()[0]||thisMonth();state.srecords.push({m:prevMonth(fm),a:obj.id,dep:round2(ov),op:true})}}
    else if(orec)state.srecords=state.srecords.filter(function(r){return r!==orec});
    ui.sEdit=null;change();break;
  case "s-del":
    if(armedBefore==="sdel:"+b.dataset.id){var sid=b.dataset.id;state.savings=state.savings.filter(function(x){return x.id!==sid});state.srecords=state.srecords.filter(function(r){return r.a!==sid});ui.sEdit=null;change()}
    else{syncSDraft();ui.armed="sdel:"+b.dataset.id;render()}break;
  case "unit":ui.unit=b.dataset.v;render();break;
  case "range":ui.range=b.dataset.v;render();break;
  case "step":ui.step=b.dataset.v;render();break;
  case "hyear":ui.histYear=b.dataset.v;render();break;
  case "entry-open":if(ui.view!=="home")ui.view="inv";ui.entryOpen=true;ui.entryMonth=suggestMonth();render();scrollToEntry();break;
  case "edit-month":ui.entryOpen=true;ui.entryMonth=b.dataset.m;ui.histYear=b.dataset.m.slice(0,4);render();scrollToEntry();break;
  case "entry-close":ui.entryOpen=false;render();break;
  case "entry-apply":
    var m=ui.entryMonth;if(!m)return;
    var edate=(document.getElementById("e-date")||{}).value||today();
    state.assets.forEach(function(as){var r=readRow(as.id),old=findRec(m,as.id);
      state.records=state.records.filter(function(x){return!(x.m===m&&x.a===as.id)});
      if(r.empty)return;var amt=round2(r.amt),val=r.val==null?null:round2(r.val);
      var rec={m:m,a:as.id,amt:amt,val:val};
      rec.d=old&&old.amt===amt&&old.d?old.d:(amt>0?edate:(old&&old.d)||null);
      rec.vd=val==null?null:(old&&old.val===val&&old.vd?old.vd:edate);
      state.records.push(rec)});
    ui.entryOpen=false;change();break;
  case "asset-new":ui.editAsset="new";ui.draft={src:"",name:"",icon:"index",color:PALETTE[state.assets.length%PALETTE.length]};render();focusName();break;
  case "asset-edit":var as=state.assets.find(function(x){return x.id===b.dataset.id});ui.editAsset=as.id;ui.draft={src:as.src||"",name:as.name,icon:as.icon||guessIcon(as.name),color:as.color};render();focusName();break;
  case "ed-icon":ui.draft.icon=b.dataset.v;render();break;
  case "ed-color":ui.draft.color=b.dataset.v;render();break;
  case "ed-cancel":ui.editAsset=null;render();break;
  case "ed-ok":
    var d=ui.draft,nm=(d.name||"").trim();if(!nm){focusName();return}
    var dsrc=(d.src||"").trim();if(ui.editAsset==="new")state.assets.push({id:uid(),name:nm,src:dsrc,icon:d.icon,color:d.color});
    else{var t=state.assets.find(function(x){return x.id===ui.editAsset});t.name=nm;t.src=dsrc;t.icon=d.icon;t.color=d.color}
    ui.editAsset=null;change();break;
  case "del-asset":
    if(armedBefore==="del:"+b.dataset.id){var id=b.dataset.id;state.assets=state.assets.filter(function(x){return x.id!==id});state.records=state.records.filter(function(r){return r.a!==id});ui.editAsset=null;change()}
    else{ui.armed="del:"+b.dataset.id;render()}break;
  case "del-month":
    if(armedBefore==="delm:"+b.dataset.m){var mm=b.dataset.m;state.records=state.records.filter(function(r){return r.m!==mm});change()}
    else{ui.armed="delm:"+b.dataset.m;ui.open[b.dataset.m]=true;render()}break;
  case "clear-sample":
    if(armedBefore==="clear"){state.assets=[];state.records=[];state.savings=[];state.srecords=[];state.debts=[];state.dpay=[];state.sample=false;ui.entryOpen=false;ui.sEntryOpen=false;change()}
    else{ui.armed="clear";render()}break;
  case "title-edit":ui.editingTitle=true;render();var ti=document.getElementById("title-in");if(ti){ti.focus();ti.select()}break;
  case "title-ok":var tv=(document.getElementById("title-in").value||"").trim();ui.editingTitle=false;if(tv&&tv!==state.title){state.title=tv;change()}else render();break;
  case "discard":state=clone(saved);dirty=false;ui.entryOpen=false;ui.editAsset=null;ui.sEntryOpen=false;ui.sEdit=null;ui.dEntryOpen=false;ui.dEdit=null;render();break;
  case "save":save();break;
  }
}
function sSuggest(){var ms=state.srecords.map(function(r){return r.m}).sort();var last=ms[ms.length-1],now=thisMonth();if(!last)return now;return last>=now?last:(nextMonth(last)<=now?nextMonth(last):now)}
function sScroll(){var e=document.getElementById("sentry");if(e)e.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"})}
function focusName(){var e=document.getElementById("ed-name");if(e)e.focus()}
function round2(v){return Math.round(v*100)/100}
function suggestMonth(){var ms=state.records.map(function(r){return r.m}).sort();var last=ms[ms.length-1],now=thisMonth();if(!last)return now;return last>=now?last:(nextMonth(last)<=now?nextMonth(last):now)}
function scrollToEntry(){var e=document.getElementById("entry");if(e)e.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"})}

/* ---------- publish ---------- */
function buildDoc(s){
  var css=document.getElementById("app-css").textContent,js=document.getElementById("app-js").textContent;
  var json=JSON.stringify(s).replace(/</g,"\\u003c");
  return "<!doctype html>\n<html lang=\"th\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\"><title>"+PAGE_TITLE+"</title>"+
    "<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\"><link rel=\"stylesheet\" href=\""+FONT_HREF+"\">"+
    "<style id=\"app-css\">"+css+"</style></head><body><div id=\"app\"></div>"+
    "<script type=\"application/json\" id=\"state\">"+json+"<\/script><script id=\"app-js\">"+js+"<\/script></body></html>";
}
function save(){
  if(!token||ui.saving)return;
  ui.saving=true;ui.msg="";render();
  gs("save",[token,JSON.stringify(state),DATA_VER]).then(function(r){
    ui.saving=false;
    if(r&&r.ok){DATA_VER=r.ver;saved=clone(state);dirty=false;fromSeed=false;ui.msg="";render();return}
    if(r&&r.code==="auth"){authLost();return}
    if(r&&r.code==="conflict")ui.msg="มีการบันทึกจากเครื่องอื่นหลังจากเปิดหน้านี้ รีเฟรชหน้าเพื่อโหลดข้อมูลล่าสุด แล้วค่อยบันทึกใหม่";
    else ui.msg="บันทึกไม่สำเร็จ ("+((r&&r.code)||"ไม่ทราบสาเหตุ")+") ลองกดบันทึกอีกครั้ง";
    render();
  },function(e){ui.saving=false;ui.msg="บันทึกไม่สำเร็จ เชื่อมต่อไม่ได้ ลองกดบันทึกอีกครั้ง";render()});
}

/* ---------- boot ---------- */
function loadData(){var el=document.getElementById("app");el.innerHTML='<div class="empty" style="padding:80px 0">กำลังโหลดข้อมูล…</div>';
  return fetch(API+"?api=state").then(function(r){return r.json()}).then(function(r){if(!r||!r.ok)throw 0;setData(r.state,r.ver);render()})
  .catch(function(){el.innerHTML='<div class="empty" style="padding:80px 0">โหลดข้อมูลไม่สำเร็จ <button class="btn sm" onclick="location.reload()">ลองอีกครั้ง</button></div>'})}
var booted=loadData();
var rt;window.addEventListener("resize",function(){clearTimeout(rt);rt=setTimeout(drawAll,120)});
try{matchMedia("(prefers-color-scheme: dark)").addEventListener("change",drawAll)}catch(e){}
new MutationObserver(drawAll).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});
booted.then(function(){var t=lsGet("dca-token");if(!t)return;gs("check",[t]).then(function(r){if(r&&r.ok){token=t;setEdit();render()}else lsSet("dca-token",null)},function(){})});
window.addEventListener("beforeunload",function(e){if(dirty&&token){e.preventDefault();e.returnValue=""}});
})();
</script>

</body></html>
